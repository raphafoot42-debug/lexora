<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SP Studio</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#10141c;--text:#f7f8fb;--muted:#a4acbb;--accent:#71a7ff;--ok:#71e1b1;--danger:#ff8b93}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,#13182b 0,#07090d 48%,#05060a 100%);color:var(--text)}
.wrap{max-width:960px;margin:0 auto;padding:40px 24px 64px}.brand{font-weight:700;letter-spacing:.02em;font-size:18px}.sub{color:var(--muted);margin-top:6px}.panel{margin-top:28px;background:rgba(16,20,28,.86);border:1px solid rgba(255,255,255,.07);border-radius:22px;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.26);backdrop-filter:blur(12px)}
label{display:block;font-size:13px;color:var(--muted);margin:18px 0 8px}input,textarea,select{width:100%;padding:14px 15px;border-radius:13px;background:#0b0e14;color:#fff;border:1px solid #262c37;outline:none;font:inherit}textarea{min-height:180px;resize:vertical}button{margin-top:20px;width:100%;padding:15px;border-radius:13px;border:0;background:linear-gradient(90deg,#63a2ff,#8c74ff);color:#fff;font-weight:700;font-size:15px;cursor:pointer}.status{margin-top:20px;padding:14px 16px;border-radius:14px;background:#0b0e14;color:var(--muted);border:1px solid #202632;white-space:pre-wrap}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}.progress{height:6px;border-radius:99px;background:#171b24;margin-top:18px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#63a2ff,#8c74ff);transition:width .35s}.result{margin-top:22px;display:none}.result video{width:100%;max-height:720px;border-radius:16px;background:#05060a}.links a{color:#9ebeff;text-decoration:none;margin-right:14px;font-size:13px}
small{color:#707889}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">SP Studio</div>
  <div class="sub">Ton studio vidéo local — transforme un site réel en démonstration produit.</div>

  <div class="panel">
    <label for="url">URL du site à analyser</label>
    <input id="url" value="">
    <label for="title">Titre de la vidéo</label>
    <input id="title" value="">
    <label for="style">Style</label>
    <select id="style"><option>Dynamique</option><option>Professionnel</option><option>Publicitaire</option><option>Minimaliste</option></select>
    <label for="description">Description ou message à mettre en avant</label>
    <textarea id="description"></textarea>
    <button id="go">Analyser le site et créer la vidéo</button>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="status" id="status">Prêt.</div>
    <div class="result" id="result">
      <video id="player" controls playsinline></video>
      <div class="links" style="margin-top:12px">
        <a id="storyboard" target="_blank">Storyboard</a>
        <a id="analysis" target="_blank">Analyse</a>
        <a id="quality" target="_blank">Contrôle qualité</a>
        <a id="script" target="_blank">Script voix</a>
      </div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
function setStatus(text, type=''){ $('status').textContent=text; $('status').className='status '+type; }
function setBar(step){
  $('bar').style.width = ({'1/3 — Explorer':'30%','2/3 — Construire':'62%','3/3 — Rendre':'82%','Terminé':'100%','Erreur':'100%'}[step] || '8%');
}
async function start(){
  $('go').disabled=true; $('result').style.display='none'; setStatus('Lancement…'); setBar('');
  const r = await fetch('/api/projet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    url:$('url').value,title:$('title').value,style:$('style').value,description:$('description').value
  })});
  const data = await r.json();
  if(!r.ok){ setStatus(data.error||'Erreur.','err'); $('go').disabled=false; return; }
  const timer=setInterval(async()=>{
    const x=await fetch('/api/job/'+data.jobId).then(r=>r.json());
    const j=x.job; setStatus(j.message || j.step); setBar(j.step);
    if(j.status==='done'){
      clearInterval(timer); $('go').disabled=false; $('result').style.display='block';
      $('player').src=j.result.video+'?t='+Date.now();
      $('storyboard').href=j.result.storyboard; $('analysis').href=j.result.analysis; $('quality').href=j.result.quality; $('script').href=j.result.script;
      setStatus('Vidéo prête.','ok');
    } else if(j.status==='error'){
      clearInterval(timer); $('go').disabled=false; setStatus(j.message,'err');
    }
  },900);
}
$('go').addEventListener('click',start);
</script>
</body>
</html>
