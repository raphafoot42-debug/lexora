<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AffiniX</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --blue:#3468e0; --cyan:#ffb84a; --bg:#05070d; --text:#e7ebf7; --dim:#8892b0;
    --card:linear-gradient(180deg, rgba(23,32,55,0.66), rgba(12,17,30,0.55));
    --border:rgba(96,156,248,0.14);
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden; width:100%; max-width:100%; background:var(--bg) !important;}
  body{
    margin:0; min-height:100vh; font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
    background:
      radial-gradient(1300px 900px at 50% 20%, rgba(30,38,68,0.55), transparent 65%),
      radial-gradient(1300px 700px at 8% -5%, rgba(52,104,224,0.30), transparent 60%),
      radial-gradient(1100px 800px at 112% 8%, rgba(255,184,74,0.26), transparent 55%),
      var(--bg);
    color:var(--text); letter-spacing:-0.01em;
  }
  a{color:inherit;}
  .orb{position:fixed;border-radius:999px;filter:blur(110px);pointer-events:none;z-index:0;opacity:.65;animation:drift 18s ease-in-out infinite;}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(20px,-30px) scale(1.08);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .anim{animation:fadeUp .55s cubic-bezier(.16,1,.3,1) both;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .card{background:var(--card);border:1px solid var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:20px;transition:.35s ease;}
  .card:hover{border-color:rgba(96,156,248,0.4);box-shadow:0 12px 40px -12px rgba(30,64,175,0.55);}
  .btn-primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#04101f;font-weight:700;border:none;cursor:pointer;box-shadow:0 8px 24px -8px rgba(52,104,224,.65);transition:.2s ease;font-size:14px;}
  .btn-primary:hover{transform:translateY(-1px);filter:brightness(1.06);}
  .btn-ghost{background:transparent;border:1px solid rgba(148,163,184,.2);color:#cbd5e1;cursor:pointer;font-weight:600;font-size:13px;border-radius:12px;}
  .btn-danger{background:transparent;border:1px solid rgba(248,113,113,.35);color:#fca5a5;font-weight:600;cursor:pointer;font-size:12px;border-radius:10px;}
  input, select{background:rgba(8,12,22,.7);border:1px solid rgba(148,163,184,.18);color:var(--text);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:14px;width:100%;}
  input:focus, select:focus{outline:none;border-color:#5c9cf8;box-shadow:0 0 0 3px rgba(96,156,248,.18);}
  label.field{display:flex;flex-direction:column;gap:6px;}
  label.field span{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:12px 16px;}
  td{padding:14px 16px;border-top:1px solid rgba(148,163,184,.08);}
  tr.row:hover{background:rgba(255,255,255,.02);cursor:pointer;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;}
  .dot{width:6px;height:6px;border-radius:999px;}
  .badge{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg, rgba(52,104,224,.25), rgba(255,184,74,.15));border:1px solid rgba(96,156,248,.3);box-shadow:0 0 18px -2px rgba(96,156,248,.55);}
  .kpi-val{font-size:32px;font-weight:800;color:#fff;}
  .modal-bg{position:fixed;inset:0;background:rgba(4,6,12,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fadeIn .2s ease both;}
  .icon{width:17px;height:17px;stroke:#5c9cf8;}
  .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
  .grid-kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
  @media(min-width:900px){.grid-kpi{grid-template-columns:repeat(4,minmax(0,1fr));}}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(96,156,248,.25);border-radius:999px;}
  .sidebar{width:256px;flex-shrink:0;display:none;flex-direction:column;gap:8px;padding:20px;border-right:1px solid rgba(96,156,248,.1);position:relative;z-index:10;}
  @media(min-width:768px){.sidebar{display:flex;} .topbar-mobile{display:none !important;} .content{padding-top:32px !important;}}
  .navitem{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;color:#cbd5e1;background:none;border:none;cursor:pointer;text-align:left;width:100%;transition:.2s ease;}
  .navitem:hover{background:rgba(96,156,248,.08);}
  .navitem.active{background:linear-gradient(90deg, rgba(52,104,224,.22), rgba(255,184,74,.06));border:1px solid rgba(96,156,248,.35);color:#bfe0ff;}
  .topbar-mobile{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(5,7,13,.75);backdrop-filter:blur(18px);border-bottom:1px solid rgba(96,156,248,.12);}
  .content{flex:1;position:relative;z-index:10;padding:16px;padding-top:76px;max-width:1120px;margin:0 auto;width:100%;}
  .shell{display:flex;min-height:100vh;}
  .err{color:#fca5a5;font-size:12px;font-weight:600;}
  .ok{color:#6ee7b7;font-size:12px;font-weight:600;}
  .muted{color:var(--dim);}
  .mono{font-family:ui-monospace,monospace;}
  .stat-card2{padding:16px 16px 0;position:relative;overflow:hidden;height:118px;border-radius:18px;}
  .stat-card2.green{background:linear-gradient(180deg, rgba(16,60,45,.55), rgba(12,17,30,.55));border-color:rgba(52,211,153,.25) !important;}
  .stat-card2.gold{background:linear-gradient(180deg, rgba(70,45,10,.5), rgba(12,17,30,.55));border-color:rgba(255,184,74,.3) !important;}
  .stat-label2{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);}
  .stat-val2{font-size:25px;font-weight:800;margin-top:8px;}
  .spark{position:absolute;bottom:0;left:0;right:0;height:42px;}
  .level-card{background:linear-gradient(135deg, rgba(52,104,224,.18), rgba(255,184,74,.10));border:1px solid rgba(96,156,248,.3);border-radius:18px;padding:16px 18px;margin-bottom:16px;}
  .xp-bar{height:9px;border-radius:999px;background:rgba(148,163,184,.15);overflow:hidden;}
  .xp-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:999px;}
  .xp-label{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:6px;}
  .bottomnav{display:none;}
  @media(max-width:767px){
    .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(8,10,18,.92);backdrop-filter:blur(18px);border-top:1px solid rgba(96,156,248,.12);justify-content:space-around;padding:8px 6px 16px;z-index:40;}
    .content{padding-bottom:90px !important;}
  }
  .navbtn2{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:10px;font-weight:600;background:none;border:none;padding:4px;}
  .navbtn2.active{color:#ffb84a;}
  .navbtn2 svg{width:19px;height:19px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   AffiniX — front autonome (HTML/CSS/JS) + backend Vercel/Supabase.
   Rôles : admin (chef principal), chief (sous-chef, accès filtré à ses
   propres sous-affiliés), member (sous-affilié).
   ===================================================================== */

const STORAGE_KEY = "ah_data";

function defaultRewardTiers(){
  return [
    {id:"tier_10", ftd:10, amount:100},
    {id:"tier_100", ftd:100, amount:900},
    {id:"tier_500", ftd:500, amount:4000},
    {id:"tier_1000", ftd:1000, amount:5000},
  ];
}
function defaultMemberLinks(){ return { community:[], game:[], liens:[] }; }
function migrateMemberLinks(db){
  if(!db.memberLinks){ db.memberLinks = defaultMemberLinks(); return; }
  const ml = db.memberLinks;
  if(ml.community===undefined || ml.game===undefined){
    const genId = ()=>"lnk_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    const community = ml.communityUrl ? [{id:genId(), label:"Communauté", url:ml.communityUrl}] : [];
    const game = ml.gameUrl ? [{id:genId(), label:ml.gameLabel||"Lancer le jeu", url:ml.gameUrl}] : [];
    db.memberLinks = { community, game, liens: ml.liens||[] };
  }
  if(db.memberLinks.liens===undefined) db.memberLinks.liens = [];
}

// URL du backend : toujours l'origine actuelle (Vercel), plus jamais une URL
// externe fixée en dur — évite les bugs de synchro liés à un mauvais domaine.
const SYNC_API_URL = window.location.origin;
const SYNC_API_KEY = "fyjrtychjughfghcddthhhcffghhjjvvcddssety";
const REMOTE_URL = SYNC_API_URL;

function defaultDB(){
  return {
    affiliates: [],
    passcode: "290942",           // Chef (toi)
    chiefs: [                     // Sous-chefs : chacun son mot de passe, sa commission de recrutement (%), et ses propres sous-affiliés (ownerChiefId)
      {id:"chief_antoine", name:"Antoine", passcode:"joRd@ne7", recruitPercent:10, defaultCommissionPerFtd:20},
      {id:"chief_michel", name:"Michel", passcode:"mhl", recruitPercent:10, defaultCommissionPerFtd:20}
    ],
    mainTrackingLink: "",
    syncConfig: { apiUrl: "", apiKey: "" },
    referralPercent: 10,          // Parrainage : % du CA du filleul (remplace l'ancien bonus fixe par FTD)
    defaultBaseLink: "",
    defaultBaseLinkLabel: "Signup",
    defaultCommissionPerFtd: 20,
    allowSelfSignup: true,
    pendingSignups: [],
    memberLinks: defaultMemberLinks(),
    rewardTiers: defaultRewardTiers()
  };
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      normalizeDB(parsed);
      return parsed;
    }
  }catch(e){ console.error(e); }
  return defaultDB();
}
function normalizeDB(db){
  if(db.mainTrackingLink===undefined) db.mainTrackingLink="";
  if(!db.syncConfig) db.syncConfig={apiUrl:"",apiKey:""};
  if(db.referralPercent===undefined) db.referralPercent = 10;
  if(db.defaultBaseLink===undefined) db.defaultBaseLink="";
  if(db.defaultBaseLinkLabel===undefined) db.defaultBaseLinkLabel="Signup";
  if(db.defaultCommissionPerFtd===undefined) db.defaultCommissionPerFtd = 20;
  if(!db.chiefs) db.chiefs = defaultDB().chiefs;
  db.chiefs.forEach(c=>{ if(c.recruitPercent===undefined) c.recruitPercent=10; if(c.defaultCommissionPerFtd===undefined) c.defaultCommissionPerFtd=20; });
  (db.affiliates||[]).forEach(a=>{
    if(a.commissionPerFtd===undefined) a.commissionPerFtd = 20;
    if(a.ownerChiefId===undefined) a.ownerChiefId = null;
    if(a.referredBy===undefined) a.referredBy=null;
    if(!a.messages) a.messages=[];
    if(!a.paymentInfo) a.paymentInfo=null;
    if(!a.email) a.email="";
  });
  if(db.allowSelfSignup===undefined) db.allowSelfSignup=true;
  if(!db.pendingSignups) db.pendingSignups=[];
  migrateMemberLinks(db);
  if(!db.rewardTiers) db.rewardTiers=defaultRewardTiers();
}
function saveData(){
  DB.localEditedAt = Date.now();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){ console.error(e); }
  pushRemoteDB();
}
function pushRemoteDB(){
  if(!REMOTE_URL || !SYNC_API_KEY) return;
  const payload = JSON.parse(JSON.stringify(DB));
  payload.syncConfig = { apiUrl: REMOTE_URL, apiKey: "" };
  fetch(REMOTE_URL+"/api/db", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":SYNC_API_KEY},
    body: JSON.stringify(payload)
  }).catch(()=>{});
}
async function fetchRemoteDB(){
  if(!REMOTE_URL) return;
  try{
    if(DB.localEditedAt && (Date.now() - DB.localEditedAt < 180000)){ pushRemoteDB(); return; }
    const res = await fetch(REMOTE_URL+"/api/db");
    if(!res.ok) return;
    const { db } = await res.json();
    if(!db){ pushRemoteDB(); return; }
    normalizeDB(db);
    db.syncConfig = { apiUrl: REMOTE_URL, apiKey: "" };
    DB = db;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    render();
  }catch(e){ /* serveur injoignable — on garde la copie locale */ }
}

/* ---------------- Notifications ---------------- */
const NOTIF_MEMBER_KEY = "affinix_notif_member";
const NOTIF_ADMIN_KEY = "affinix_notif_admin";
const FTD_BASELINE_KEY = "affinix_ftd_baseline";
function notifSupported(){ return typeof Notification !== "undefined"; }
function notifEnabled(key){ return notifSupported() && Notification.permission==="granted" && localStorage.getItem(key)==="1"; }
async function toggleFtdNotifications(key){
  if(!notifSupported()){ alert("Les notifications ne sont pas prises en charge sur cet appareil/navigateur."); return; }
  if(notifEnabled(key)){ localStorage.setItem(key,"0"); render(); return; }
  const perm = await Notification.requestPermission();
  if(perm==="granted"){
    localStorage.setItem(key,"1");
    primeFtdBaseline();
    showFtdNotification("Notifications activées ✔", "Tu seras alerté dès qu'un nouveau dépôt arrive.");
  } else { localStorage.setItem(key,"0"); }
  render();
}
function showFtdNotification(title, body){
  try{
    if("serviceWorker" in navigator){
      navigator.serviceWorker.ready.then(reg=>{
        if(reg && reg.showNotification) reg.showNotification(title, { body, icon:"icon-192.png", badge:"icon-192.png" });
        else if(notifSupported()) new Notification(title, { body, icon:"icon-192.png" });
      }).catch(()=>{ if(notifSupported()) new Notification(title, { body, icon:"icon-192.png" }); });
    } else if(notifSupported()){ new Notification(title, { body, icon:"icon-192.png" }); }
  }catch(e){ console.error(e); }
}
function getFtdBaseline(){ try{ return JSON.parse(localStorage.getItem(FTD_BASELINE_KEY)||"{}"); }catch(e){ return {}; } }
function setFtdBaseline(obj){ try{ localStorage.setItem(FTD_BASELINE_KEY, JSON.stringify(obj)); }catch(e){} }
function primeFtdBaseline(){
  const baseline = {};
  (DB.affiliates||[]).forEach(a=>{ baseline[a.id] = sumStats(a.dailyStats).ftd; });
  setFtdBaseline(baseline);
}
function checkFtdNotifications(){
  if(!DB || !DB.affiliates) return;
  const memberOn = notifEnabled(NOTIF_MEMBER_KEY) && SESSION && SESSION.role==="member";
  const adminOn = notifEnabled(NOTIF_ADMIN_KEY) && SESSION && (SESSION.role==="admin"||SESSION.role==="chief");
  if(!memberOn && !adminOn) return;
  const baseline = getFtdBaseline();
  const firstRun = Object.keys(baseline).length===0;
  const newBaseline = {};
  DB.affiliates.forEach(a=>{
    const ftd = sumStats(a.dailyStats).ftd;
    newBaseline[a.id] = ftd;
    if(firstRun) return;
    const prev = baseline[a.id];
    if(prev===undefined || ftd<=prev) return;
    const diff = ftd - prev;
    if(adminOn && (SESSION.role==="admin" || a.ownerChiefId===SESSION.chiefId)){
      showFtdNotification("Nouveau dépôt 🎉", `${a.name} vient de générer ${diff} dépôt${diff>1?"s":""} supplémentaire${diff>1?"s":""}.`);
    }
    if(memberOn && SESSION.id===a.id){
      showFtdNotification("Nouveau dépôt 🎉", `Tu viens de générer ${diff} nouveau${diff>1?"x":""} dépôt${diff>1?"s":""} !`);
    }
  });
  setFtdBaseline(newBaseline);
}
setInterval(()=>{ fetchRemoteDB().then(checkFtdNotifications); }, 60000);
function notifButtonHtml(key){
  const on = notifEnabled(key);
  const blocked = notifSupported() && Notification.permission==="denied";
  if(blocked) return `<span style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)">${icon('bell',14,'#8892b0')} Notifications bloquées</span>`;
  return `<button class="btn-ghost" style="padding:8px 14px;font-size:13px;display:flex;align-items:center;gap:6px;${on?'color:#6ee7b7;border-color:rgba(52,211,153,.3)':''}" onclick="toggleFtdNotifications('${key}')">${icon('bell',14,on?'#6ee7b7':'#5c9cf8')} ${on?"Notifications activées":"Activer les notifications"}</button>`;
}

let DB = loadData();
let SESSION = null; // {role:'admin'} | {role:'chief', chiefId, name} | {role:'member', id}
let VIEW = "overview";
let charts = {};
const urlRefCode = new URLSearchParams(location.search).get("ref") || "";

/* ---------------- utils ---------------- */
const uid = (p="aff") => p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const todayStr = () => new Date().toISOString().slice(0,10);
const eur = n => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(Number(n)||0);
const numf = n => new Intl.NumberFormat('fr-FR').format(Number(n)||0);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function isoWeekStart(dateStr){ const d=new Date(dateStr+"T00:00:00"); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.toISOString().slice(0,10); }
const monthKey = d => d.slice(0,7);
function labelForKey(key, period){
  if(period==="day"||period==="week"){ const d=new Date(key+"T00:00:00"); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}); }
  const [y,m]=key.split('-'); return new Date(+y,+m-1,1).toLocaleDateString('fr-FR',{month:'short',year:'2-digit'});
}
function sumStats(list){
  return list.reduce((a,s)=>{a.clicks+=+s.clicks||0;a.signups+=+s.signups||0;a.ftd+=+s.ftd||0;a.deposits+=+s.deposits||0;a.revenue+=+s.revenue||0;return a;},{clicks:0,signups:0,ftd:0,deposits:0,revenue:0});
}
function groupStats(list, period){
  const map=new Map();
  for(const s of list){
    const key = period==="day"?s.date:period==="week"?isoWeekStart(s.date):monthKey(s.date);
    const cur = map.get(key)||{key,clicks:0,signups:0,ftd:0,deposits:0,revenue:0};
    cur.clicks+=+s.clicks||0;cur.signups+=+s.signups||0;cur.ftd+=+s.ftd||0;cur.deposits+=+s.deposits||0;cur.revenue+=+s.revenue||0;
    map.set(key,cur);
  }
  return Array.from(map.values()).sort((a,b)=>a.key.localeCompare(b.key)).map(r=>({...r,label:labelForKey(r.key,period)}));
}
function findAffiliate(id){ return DB.affiliates.find(a=>a.id===id); }
function findChief(id){ return DB.chiefs.find(c=>c.id===id); }
function visibleAffiliates(){
  if(SESSION.role==="chief") return DB.affiliates.filter(a=>a.ownerChiefId===SESSION.chiefId);
  return DB.affiliates.filter(a=>!a.ownerChiefId);
}

/* ---------------- parrainage (% du CA du filleul) ---------------- */
function filleulsOf(sponsorId){ return DB.affiliates.filter(a=>a.referredBy===sponsorId); }
function referralEarningsFor(filleul){ return sumStats(filleul.dailyStats).revenue * ((DB.referralPercent||0)/100); }
function totalReferralEarnings(sponsorId){ return filleulsOf(sponsorId).reduce((acc,f)=>acc+referralEarningsFor(f),0); }
function referralHistoryFor(sponsorId){
  const rows=[];
  filleulsOf(sponsorId).forEach(f=>{
    f.dailyStats.forEach(s=>{
      if(+s.revenue>0) rows.push({date:s.date, filleulName:f.name, revenue:+s.revenue, amount:+s.revenue*((DB.referralPercent||0)/100)});
    });
  });
  return rows.sort((a,b)=>b.date.localeCompare(a.date));
}

/* ---------------- messagerie interne ---------------- */
function unreadForAdmin(a){ return (a.messages||[]).filter(m=>m.from==="member" && !m.readByAdmin).length; }
function unreadForMember(a){ return (a.messages||[]).filter(m=>m.from==="admin" && !m.readByMember).length; }
function totalUnreadForAdmin(){ return visibleAffiliates().reduce((n,a)=>n+unreadForAdmin(a),0); }
function sendMessage(affiliateId, from, text){
  const a = findAffiliate(affiliateId);
  if(!a || !text.trim()) return;
  if(!a.messages) a.messages=[];
  a.messages.push({ id: uid("msg"), from, text: text.trim(), at: new Date().toISOString(), readByAdmin: from==="admin", readByMember: from==="member" });
  saveData();
}
function markReadByAdmin(a){ if(!unreadForAdmin(a)) return; (a.messages||[]).forEach(m=>{ if(m.from==="member") m.readByAdmin=true; }); saveData(); }
function markReadByMember(a){ if(!unreadForMember(a)) return; (a.messages||[]).forEach(m=>{ if(m.from==="admin") m.readByMember=true; }); saveData(); }
function fmtMsgTime(iso){ const d=new Date(iso); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+" · "+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function messageThreadHtml(a, forRole){
  const msgs = a.messages||[];
  return `<div style="display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:4px 2px 4px 0" id="msgThreadScroll">
    ${msgs.length ? msgs.map(m=>{
      const mine = (forRole!=="member" && m.from==="admin") || (forRole==="member" && m.from==="member");

let sparkCharts = {};
function cumulativeSeries(list, key){
  const sorted = [...list].sort((a,b)=>a.date.localeCompare(b.date));
  let sum = 0;
  const series = sorted.map(s => { sum += (+s[key]||0); return sum; });
  return series.length ? series : [0];
}

function setLoginTab(t){ loginTab=t; signupSuccess=""; renderLogin(); }
async function submitSelfSignup(e){
  e.preventDefault();
  const name = document.getElementById("regName").value.trim();
  const code = document.getElementById("regCode").value.trim();
  const refInput = document.getElementById("regRef").value.trim();
  if(!name || !code) return renderLogin("Nom et code d'accès sont obligatoires."), false;
  const taken = DB.affiliates.some(a=>a.code.toLowerCase()===code.toLowerCase()) || (DB.pendingSignups||[]).some(p=>p.code.toLowerCase()===code.toLowerCase());
  if(taken) return renderLogin("Ce code d'accès est déjà pris, choisis-en un autre."), false;
  if(REMOTE_URL){
    try{
      const res = await fetch(REMOTE_URL+"/api/signup", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({name, code, ref: refInput}) });
      const data = await res.json();
      if(!res.ok){ return renderLogin(data.error||"Inscription impossible pour le moment."), false; }
      DB.pendingSignups = DB.pendingSignups||[];
      DB.pendingSignups.unshift(data.request);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
      signupSuccess = "Ta demande a été envoyée ✔ L'administrateur doit la valider.";
      loginTab = "member"; renderLogin();
      return false;
    }catch(err){ return renderLogin("Le serveur est momentanément injoignable. Réessaie dans un instant."), false; }
  }
  DB.pendingSignups = DB.pendingSignups||[];
  DB.pendingSignups.unshift({id:uid(), name, code, ref:refInput, requestedAt:new Date().toISOString()});
  saveData();
  signupSuccess = "Ta demande a été envoyée ✔";
  loginTab = "member"; renderLogin();
  return false;
}
function approveSignup(reqId){
  const req = (DB.pendingSignups||[]).find(p=>p.id===reqId);
  if(!req) return;
  if(!DB.defaultBaseLink){ alert("Renseigne d'abord un lien de base dans Réglages avant de valider."); return; }
  let referredBy = null;
  if(req.ref){ const sponsor = DB.affiliates.find(a=>a.code.toLowerCase()===req.ref.toLowerCase()); if(sponsor) referredBy = sponsor.id; }
  const ownerChiefId = SESSION.role==="chief" ? SESSION.chiefId : null;
  const comm = SESSION.role==="chief" ? (findChief(SESSION.chiefId).defaultCommissionPerFtd||20) : (DB.defaultCommissionPerFtd||20);
  DB.affiliates.unshift({
    id: uid(), name: req.name, code: req.code,
    baseLinks: [{label: DB.defaultBaseLinkLabel||"Signup", url: DB.defaultBaseLink}],
    commissionPerFtd: comm, ownerChiefId,
    referredBy, status:"active", createdAt: todayStr(), dailyStats: [], messages: [], paymentInfo:null, email:""
  });
  DB.pendingSignups = DB.pendingSignups.filter(p=>p.id!==reqId);
  saveData(); render();
}
function rejectSignup(reqId){
  if(!confirm("Refuser cette demande d'inscription ?")) return;
  DB.pendingSignups = (DB.pendingSignups||[]).filter(p=>p.id!==reqId);
  saveData(); render();
}
function submitMemberLogin(e){
  e.preventDefault();
  const name = document.getElementById("loginName").value.trim();
  const code = document.getElementById("loginCode").value.trim();
  const match = DB.affiliates.find(a=>a.name.trim().toLowerCase()===name.toLowerCase() && a.code===code);
  if(!match) return renderLogin("Nom ou code incorrect."), false;
  if(match.status!=="active") return renderLogin("Ce compte est actuellement suspendu."), false;
  SESSION = {role:"member", id:match.id}; VIEW="overview"; render();
  return false;
}
// Connexion admin unifiée : un seul champ, le mot de passe détermine le rôle.
function submitAdminLogin(e){
  e.preventDefault();

}

function closeAdminConversation(){ messagesOpenId=null; render(); }
function adminMessagesHtml(){
  const affs = visibleAffiliates();
  if(messagesOpenId){
    const a = findAffiliate(messagesOpenId);
    if(!a){ messagesOpenId=null; return adminMessagesHtml(); }
    return `
      <div class="anim" style="margin-bottom:20px;display:flex;align-items:center;gap:12px">
        <button class="btn-ghost" style="padding:8px 12px" onclick="closeAdminConversation()">${icon('arrowleft',16)}</button>
        <div><h1 style="font-size:22px;font-weight:800;margin:0">${esc(a.name)}</h1><p class="muted" style="margin:2px 0 0;font-size:13px">Code : ${esc(a.code)}</p></div>

        ${messageThreadHtml(a, "admin")}
        <form onsubmit="return submitAdminMessage(event,'${a.id}')" style="display:flex;gap:10px;margin-top:14px">

          <button class="btn-primary" style="border-radius:12px;padding:0 20px;flex-shrink:0">${icon('send',15,'#04101f')}</button>
        </form>
      </div>`;
  }
  const list = affs.slice().sort((x,y)=>{ const lx=(x.messages||[]).slice(-1)[0]; const ly=(y.messages||[]).slice(-1)[0]; return (ly?ly.at:"").localeCompare(lx?lx.at:""); });
  return `
    <div class="anim" style="margin-bottom:20px"><h1 style="font-size:28px;font-weight:800;margin:0">Messages</h1><p class="muted" style="margin:6px 0 0;font-size:14px">Conversations avec tes sous-affiliés.</p></div>
    <div class="card anim" style="overflow:hidden">
      ${list.length ? list.map(a=>{

          <span class="muted" style="font-size:12px;flex-shrink:0">${last?fmtMsgTime(last.at):""}</span>
        </div>`;
      }).join("") : `<div style="text-align:center;padding:40px;color:var(--dim)">Aucun sous-affilié pour le moment.</div>`}

function submitAdminMessage(e, affiliateId){
  e.preventDefault();
  const input = document.getElementById("adminMsgInput"); const text = input.value.trim(); if(!text) return false;

  requestAnimationFrame(()=>{ const t=document.getElementById("msgThreadScroll"); if(t) t.scrollTop=t.scrollHeight; });
  return false;
}

function submitCommSettings(e){
  e.preventDefault();
  DB.defaultCommissionPerFtd = Number(document.getElementById("fDefaultComm").value)||20;
  DB.referralPercent = Number(document.getElementById("fRefPct").value)||10;
  saveData();
  const msg=document.getElementById("commMsg"); msg.className="ok"; msg.textContent="Enregistré ✔";
  return false;
}
function submitSignupConfig(e){
  e.preventDefault();
  DB.allowSelfSignup = document.getElementById("fAllowSignup").checked;
  DB.defaultBaseLink = document.getElementById("fDefaultBaseLink").value.trim();
  DB.defaultBaseLinkLabel = document.getElementById("fDefaultBaseLinkLabel").value.trim() || "Signup";
  saveData();
  const msg=document.getElementById("signupMsg"); msg.className="ok"; msg.textContent="Enregistré ✔";
  return false;
}
function submitPasscodeChange(e){
  e.preventDefault();
  const cur=document.getElementById("pCurrent").value; const next=document.getElementById("pNext").value.trim();
  const msg=document.getElementById("passMsg");
  if(cur!==DB.passcode){ msg.className="err"; msg.textContent="Mot de passe actuel incorrect."; return false; }
  if(next.length<4){ msg.className="err"; msg.textContent="Le nouveau mot de passe doit contenir au moins 4 caractères."; return false; }
  if(DB.chiefs.some(c=>c.passcode===next)){ msg.className="err"; msg.textContent="Ce mot de passe est déjà utilisé par un sous-chef."; return false; }
  DB.passcode=next; saveData();
  msg.className="ok"; msg.textContent="Mot de passe mis à jour ✔";
  document.getElementById("pCurrent").value=""; document.getElementById("pNext").value="";
  return false;
}
function resetAllData(){
  if(!confirm("Confirmer la suppression définitive de toutes les données ?")) return;
  const keepPass = DB.passcode;
  DB = defaultDB();
  DB.passcode = keepPass;
  saveData(); render();
}

function allTrackingLinks(a){
  const rows = (a.baseLinks && a.baseLinks.length) ? a.baseLinks : [];
  return rows.filter(r=>r.url).map(r=>{ const sep = r.url.includes("?") ? "&" : "?"; return { label: r.label||"Lien", link: r.url + sep + "sub=" + encodeURIComponent(a.code||"") }; });
}
function genRandomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = ""; for(let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function copyMyLink(link){
  navigator.clipboard.writeText(link).then(()=>{
    const btn = event.target; const old = btn.textContent;
    btn.textContent = "Copié ✔"; setTimeout(()=>{ btn.textContent = old; }, 1500);
  });
}

  requestAnimationFrame(()=>{ const t=document.getElementById("msgThreadScroll"); if(t) t.scrollTop=t.scrollHeight; });
  return false;
}

/* ---------------- MEMBER dashboard ---------------- */
let memberPeriod="day";
function memberDashboardHtml(a){
  const t = sumStats(a.dailyStats); const commission = t.ftd*(a.commissionPerFtd||0);
  const chartData = groupStats(a.dailyStats, memberPeriod);
  const sorted = [...a.dailyStats].sort((x,y)=>y.date.localeCompare(x.date));
  // Progression gamifiée : paliers de dépôts (0-3 débutant, 3-10 confirmé, 10-25 expert, 25+ élite)
  const levels = [
    {min:0, max:3, name:"Débutant", emoji:"🌱"},
    {min:3, max:10, name:"Affilié confirmé", emoji:"🚀"},
    {min:10, max:25, name:"Expert", emoji:"⚡"},
    {min:25, max:9999, name:"Élite", emoji:"👑"}
  ];
  const lvl = levels.find(l=>t.ftd>=l.min && t.ftd<l.max) || levels[levels.length-1];
  const lvlIdx = levels.indexOf(lvl);
  const progressPct = Math.min(100, Math.round(((t.ftd-lvl.min)/(lvl.max-lvl.min))*100));
  const remaining = Math.max(0, lvl.max - t.ftd);
  return `
    <div style="display:flex;justify-content:flex-end;margin-bottom:6px">${notifButtonHtml(NOTIF_MEMBER_KEY)}</div>
    <div class="anim" style="margin-bottom:16px"><h1 style="font-size:24px;font-weight:800;margin:0">Tableau de bord</h1><p class="muted" style="margin:6px 0 0;font-size:14px">Aperçu de ton activité</p></div>

    <div class="level-card anim">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px">
        <span style="font-weight:800;font-size:14px">${lvl.emoji} Niveau ${lvlIdx+1} — ${lvl.name}</span>
        <span style="font-size:12px;color:var(--dim);font-weight:700">${t.ftd} / ${lvl.max===9999?"∞":lvl.max} dépôts</span>
      </div>
      <div class="xp-bar"><div class="xp-fill" style="width:${progressPct}%"></div></div>
      <div class="xp-label"><span>${lvl.max===9999?"Niveau maximum atteint 🎉":`${remaining} dépôt${remaining>1?"s":""} avant le niveau suivant`}</span></div>
    </div>

    <div class="card anim" style="padding:20px 22px;margin-bottom:16px">
      <p style="font-size:12px;color:var(--dim);margin:0 0 12px;font-weight:600">Tes liens d'affiliation</p>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${allTrackingLinks(a).length? allTrackingLinks(a).map(l=>`
          <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:rgba(255,255,255,.03);border-radius:10px">
            <p class="mono" style="font-size:13px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:440px">${esc(l.link)}</p>
            <button class="btn-primary" style="border-radius:10px;padding:8px 16px;flex-shrink:0" onclick="copyMyLink('${esc(l.link).replace(/'/g,"\\'")}')">Copier</button>
          </div>`).join("") : `<p class="muted" style="font-size:13px;margin:0">Pas encore configuré — contacte ton admin.</p>`}
      </div>
    </div>

    <div class="grid-kpi" style="margin-bottom:20px">
      ${sparkStatCard('sp-mem-clicks','Visites', numf(t.clicks), null, null, 0)}
      ${sparkStatCard('sp-mem-signups','Inscriptions', numf(t.signups), null, null, 60)}
      ${sparkStatCard('sp-mem-ftd','Dépôts', numf(t.ftd), null, 'green', 120)}
      ${sparkStatCard('sp-mem-comm','Ta commission', eur(commission), '#6ee7b7', 'green', 180)}
    </div>

    <div class="card anim" style="padding:22px;margin-bottom:20px">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px"><h2 style="font-size:17px;font-weight:700;margin:0">Revenu généré</h2>${periodToggle(memberPeriod,'setMemberPeriod')}</div>
      ${chartData.length? `<div style="height:260px"><canvas id="memberChart"></canvas></div>` : `<div style="height:200px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:14px">Tes stats apparaîtront ici.</div>`}
    </div>
    <div class="card anim" style="padding:22px">
      <h2 style="font-size:17px;font-weight:700;margin:0 0 16px">Historique</h2>
      <div style="overflow-x:auto"><table style="min-width:620px">
        <thead><tr><th>Date</th><th>Visites</th><th>Inscriptions</th><th>Dépôts</th><th>CA</th><th>Ta commission</th></tr></thead>
        <tbody>${sorted.map(s=>`<tr><td>${new Date(s.date+"T00:00:00").toLocaleDateString('fr-FR')}</td><td>${numf(s.clicks)}</td><td>${numf(s.signups)}</td><td>${numf(s.ftd)}</td><td>${eur(s.revenue)}</td><td style="color:#5c9cf8;font-weight:700">${eur(s.ftd*(a.commissionPerFtd||0))}</td></tr>`).join("") || `<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--dim)">Aucune donnée pour le moment.</td></tr>`}</tbody>
      </table></div>
    </div>`;
}
function setMemberPeriod(p){ memberPeriod=p; render(); }

/* ---------------- MEMBER: paramètres ---------------- */
function memberSettingsHtml(a){
  const p = a.paymentInfo || {};
  return `
    <div class="anim" style="margin-bottom:20px;max-width:560px"><h1 style="font-size:28px;font-weight:800;margin:0">Paramètres</h1><p class="muted" style="margin:6px 0 0;font-size:14px">Ton compte et tes infos de paiement</p></div>
    <form onsubmit="return submitMemberAccount(event,'${a.id}')" class="card anim" style="padding:22px;max-width:560px;margin-bottom:16px;display:flex;flex-direction:column;gap:14px">
      <p style="margin:0;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase">Compte</p>
      <label class="field"><span>Email</span><input id="fEmail" value="${esc(a.email||'')}" placeholder="ton@email.com"/></label>
      <label class="field"><span>Nouveau code d'accès</span><input id="fNewCode" type="password" placeholder="Laisser vide pour ne pas changer"/></label>
      <p id="accountMsg"></p>
      <button class="btn-primary" style="border-radius:12px;padding:11px;width:fit-content;padding-left:24px;padding-right:24px">Enregistrer</button>
    </form>
    <form onsubmit="return submitPaymentInfo(event,'${a.id}')" class="card anim" style="padding:22px;max-width:560px;margin-bottom:16px;display:flex;flex-direction:column;gap:14px">
      <p style="margin:0;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase">Infos de paiement</p>
      <label class="field"><span>Titulaire du compte</span><input id="fPayHolder" value="${esc(p.holder||'')}"/></label>
      <label class="field"><span>IBAN</span><input id="fPayIban" value="${esc(p.iban||'')}"/></label>
      <p id="payMsg"></p>
      <button class="btn-primary" style="border-radius:12px;padding:11px;width:fit-content;padding-left:24px;padding-right:24px">Enregistrer</button>
    </form>
    <div class="card anim" style="padding:22px;max-width:560px">
      <p style="margin:0 0 12px;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase">Session</p>
      <button class="btn-danger" onclick="logout()">Déconnexion</button>
    </div>`;
}
function submitMemberAccount(e, affId){
  e.preventDefault();
  const a = findAffiliate(affId); if(!a) return false;
  a.email = document.getElementById("fEmail").value.trim();
  const newCode = document.getElementById("fNewCode").value.trim();
  if(newCode) a.code = newCode;
  saveData();
  const msg=document.getElementById("accountMsg"); msg.className="ok"; msg.textContent="Enregistré ✔";
  return false;
}
function submitPaymentInfo(e, affId){
  e.preventDefault();
  const a = findAffiliate(affId); if(!a) return false;
  a.paymentInfo = { holder: document.getElementById("fPayHolder").value.trim(), iban: document.getElementById("fPayIban").value.trim(), updatedAt: new Date().toISOString() };
  saveData();
  const msg=document.getElementById("payMsg"); msg.className="ok"; msg.textContent="Enregistré ✔";
  return false;
}

/* ---------------- MEMBER: parrainage (%) ---------------- */
function memberReferralHtml(a){
  const myFilleuls = filleulsOf(a.id); const totalRef = totalReferralEarnings(a.id);
  const regLink = `${location.origin}${location.pathname}?ref=${encodeURIComponent(a.code)}`;
  return `
    <div class="anim" style="margin-bottom:20px"><h1 style="font-size:28px;font-weight:800;margin:0">Parrainage</h1><p class="muted" style="margin:6px 0 0;font-size:14px">Touche ${DB.referralPercent||0}% du chiffre d'affaires généré par chaque filleul.</p></div>
    <div class="card anim" style="padding:22px;margin-bottom:20px">
      <p style="margin:0 0 10px;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase">Ton lien de parrainage</p>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="mono" style="background:rgba(148,163,184,.08);padding:8px 14px;border-radius:10px;font-size:13px;word-break:break-all">${esc(regLink)}</span>
        <button class="btn-ghost" style="padding:8px 14px" onclick="navigator.clipboard?.writeText('${esc(regLink)}')">${icon('copy',14)} Copier</button>
      </div>
    </div>
    <div class="grid-kpi" style="margin-bottom:20px">
      ${statCard('users','Filleuls', myFilleuls.length, 0)}
      ${statCard('gift','Revenus de parrainage', eur(totalRef), 60)}
    </div>
    <div class="card anim" style="overflow:hidden">
      <div style="padding:18px 20px 0"><h2 style="font-size:15px;font-weight:700;margin:0">Mes filleuls</h2></div>
      <div style="overflow-x:auto"><table style="min-width:480px">
        <thead><tr><th>Nom</th><th>Statut</th><th>CA généré</th><th>Ta commission (${DB.referralPercent||0}%)</th></tr></thead>
        <tbody>${myFilleuls.map(f=>`<tr><td style="font-weight:700">${esc(f.name)}</td><td>${statusPill(f.status)}</td><td>${eur(sumStats(f.dailyStats).revenue)}</td><td style="color:#5c9cf8;font-weight:700">${eur(referralEarningsFor(f))}</td></tr>`).join("") || `<tr><td colspan="4" style="text-align:center;padding:32px;color:var(--dim)">Tu n'as encore parrainé personne.</td></tr>`}</tbody>
      </table></div>
    </div>`;
}

/* ---------------- main render / router ---------------- */
function render(){
  if(!SESSION){ renderLogin(); return; }
  const app = document.getElementById("app");

  if(SESSION.role==="admin" || SESSION.role==="chief"){
    const isChief = SESSION.role==="chief";
    const roleLabel = isChief ? `Sous-chef` : "Administrateur";
    const activeName = isChief ? SESSION.name : "Administrateur";
    const nav = [
      {key:"overview", label:"Vue d'ensemble", icon:"layout"},
      {key:"affiliates", label:"Sous-affiliés", icon:"users", badge:(SESSION.role==="admin"?(DB.pendingSignups||[]).length:0)||undefined},
      {key:"messages", label:"Messages", icon:"message", badge: totalUnreadForAdmin()||undefined},
    ];
    if(!isChief){
      nav.push({key:"referrals", label:"Parrainages", icon:"gift"});
      nav.push({key:"chiefs", label:"Sous-chefs", icon:"crown"});
    }
    nav.push({key:"settings", label:"Réglages", icon:"settings"});
    let content = "";
    if(VIEW==="overview") content = adminOverviewHtml();
    else if(VIEW==="affiliates") content = adminAffiliatesHtml();
    else if(VIEW==="messages") content = adminMessagesHtml();
    else if(VIEW==="referrals" && !isChief) content = adminReferralsHtml();
    else if(VIEW==="chiefs" && !isChief) content = adminChiefsHtml();
    else if(VIEW==="settings") content = isChief ? chiefSettingsHtml() : adminSettingsHtml();
    else content = adminOverviewHtml();
    app.innerHTML = shell(nav, activeName, roleLabel, content);
    if(VIEW==="overview"){
      const affs=visibleAffiliates(); const allStats = affs.flatMap(a=>a.dailyStats);
      const d=groupStats(allStats, adminPeriod); if(d.length) renderAreaChart("adminChart", d);
      drawSpark("sp-adm-clicks", cumulativeSeries(allStats,"clicks"), "#5c9cf8");
      drawSpark("sp-adm-signups", cumulativeSeries(allStats,"signups"), "#ffb84a");
      drawSpark("sp-adm-ftd", cumulativeSeries(allStats,"ftd"), "#34d399");
      drawSpark("sp-adm-comm", cumulativeSeries(allStats,"ftd"), "#fbbf24");
    }
    if(VIEW==="affiliates" && detailId){ const a=findAffiliate(detailId); if(a){ const d=groupStats(a.dailyStats, detailPeriod); if(d.length) renderAreaChart("detailChart", d); } }
    if(VIEW==="messages" && messagesOpenId){ const t=document.getElementById("msgThreadScroll"); if(t) t.scrollTop=t.scrollHeight; }
    return;
  }

  const a = findAffiliate(SESSION.id);
  if(!a){
    app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
      <div class="card" style="padding:32px;max-width:360px;text-align:center"><p style="margin:0 0 16px">Ton compte n'est plus disponible.</p>
      <button class="btn-primary" style="border-radius:12px;padding:10px 20px" onclick="logout()">Retour à la connexion</button></div></div>`;
    return;
  }
  const nav = [
    {key:"overview", label:"Tableau de bord", icon:"layout"},
    {key:"tutorial", label:"Tutoriel", icon:"book"},
    {key:"referral", label:"Parrainage", icon:"gift"},
    {key:"rewards", label:"Rewards", icon:"gift"},
    {key:"messages", label:"Messages", icon:"message", badge: unreadForMember(a)||undefined},
    {key:"settings", label:"Paramètres", icon:"settings"},
  ];
  let memberContent;
  if(VIEW==="referral") memberContent = memberReferralHtml(a);
  else if(VIEW==="tutorial") memberContent = memberTutorialHtml(a);
  else if(VIEW==="rewards") memberContent = memberRewardsHtml(a);
  else if(VIEW==="messages") memberContent = memberMessagesHtml(a);
  else if(VIEW==="settings") memberContent = memberSettingsHtml(a);
  else memberContent = memberDashboardHtml(a);
  app.innerHTML = shell(nav, a.name, "Partenaire", memberContent);
  if(VIEW==="messages"){ const t=document.getElementById("msgThreadScroll"); if(t) t.scrollTop=t.scrollHeight; }
  if(VIEW==="overview"){
    const d = groupStats(a.dailyStats, memberPeriod); if(d.length) renderAreaChart("memberChart", d);
    drawSpark("sp-mem-clicks", cumulativeSeries(a.dailyStats,"clicks"), "#5c9cf8");
    drawSpark("sp-mem-signups", cumulativeSeries(a.dailyStats,"signups"), "#ffb84a");
    drawSpark("sp-mem-ftd", cumulativeSeries(a.dailyStats,"ftd"), "#34d399");
    const commSeries = cumulativeSeries(a.dailyStats,"ftd").map(v=>v*(a.commissionPerFtd||0));
    drawSpark("sp-mem-comm", commSeries, "#6ee7b7");
  }
}

render();
fetchRemoteDB().then(checkFtdNotifications);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
