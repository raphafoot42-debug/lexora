<style>
  :root{
    --blue:#3468e0; --cyan:#ffb84a; --bg:#05070d; --text:#e7ebf7; --dim:#8892b0;
    --card:linear-gradient(180deg, rgba(23,32,55,0.66), rgba(12,17,30,0.55));
    --border:rgba(96,156,248,0.14);
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden; width:100%; max-width:100%;}
  body{
    margin:0; min-height:100vh; font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
    background:
      radial-gradient(1300px 900px at 50% 20%, rgba(30,38,68,0.55), transparent 65%),
      radial-gradient(1300px 700px at 8% -5%, rgba(52,104,224,0.30), transparent 60%),

  a{color:inherit;}
  .orb{position:fixed;border-radius:999px;filter:blur(110px);pointer-events:none;z-index:0;opacity:.65;animation:drift 18s ease-in-out infinite;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .card{background:var(--card);border:1px solid var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:20px;transition:.35s ease;}
  .card:hover{border-color:rgba(96,156,248,0.4);box-shadow:0 12px 40px -12px rgba(30,64,175,0.55);}
  .btn-primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#04101f;font-weight:700;border:none;cursor:pointer;box-shadow:0 8px 24px -8px rgba(52,104,224,.65);transition:.2s ease;font-size:14px;}
  .btn-primary:hover{transform:translateY(-1px);filter:brightness(1.06);}
  .btn-ghost{background:transparent;border:1px solid rgba(148,163,184,.2);color:#cbd5e1;cursor:pointer;font-weight:600;font-size:13px;border-radius:12px;}
  input, select{background:rgba(8,12,22,.7);border:1px solid rgba(148,163,184,.18);color:var(--text);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:14px;width:100%;}
  input:focus, select:focus{outline:none;border-color:#5c9cf8;box-shadow:0 0 0 3px rgba(96,156,248,.18);}
  label.field{display:flex;flex-direction:column;gap:6px;}
  label.field span{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:12px 16px;}
  td{padding:14px 16px;border-top:1px solid rgba(148,163,184,.08);}
  tr.row:hover{background:rgba(255,255,255,.02);cursor:pointer;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;}
  .dot{width:6px;height:6px;border-radius:999px;}
  .badge{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg, rgba(52,104,224,.25), rgba(255,184,74,.15));border:1px solid rgba(96,156,248,.3);box-shadow:0 0 18px -2px rgba(96,156,248,.55);}
  .kpi-val{font-size:32px;font-weight:800;color:#fff;}
  .modal-bg{position:fixed;inset:0;background:rgba(4,6,12,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fadeIn .2s ease both;}
  .icon{width:17px;height:17px;stroke:#5c9cf8;}
  .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
  .grid-kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
  @media(min-width:900px){.grid-kpi{grid-template-columns:repeat(4,minmax(0,1fr));}}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(96,156,248,.25);border-radius:999px;}
  .sidebar{width:256px;flex-shrink:0;display:none;flex-direction:column;gap:8px;padding:20px;border-right:1px solid rgba(96,156,248,.1);position:relative;z-index:10;}
  @media(min-width:768px){.sidebar{display:flex;} .topbar-mobile{display:none !important;} .content{padding-top:32px !important;}}
  .navitem{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;color:#cbd5e1;background:none;border:none;cursor:pointer;text-align:left;width:100%;transition:.2s ease;}
  .navitem:hover{background:rgba(96,156,248,.08);}

  .shell{display:flex;min-height:100vh;}
  .err{color:#fca5a5;font-size:12px;font-weight:600;}
  .ok{color:#6ee7b7;font-size:12px;font-weight:600;}
  .muted{color:var(--dim);}
  .mono{font-family:ui-monospace,monospace;}

<body>
<div id="app"></div>

<script>
/* =====================================================================
   AffiliateHub — site statique autonome (HTML/CSS/JS, sans backend)
   =====================================================================
   Stockage : localStorage du navigateur (clé "ah_data").
   IMPORTANT — puisque ce site n'a pas de serveur, les données restent
   dans le navigateur où elles ont été saisies. Un sous-affilié qui se
   connecte depuis un autre appareil ne verra pas automatiquement les
   données que l'admin a entrées sur son propre ordinateur. Utilise le
   bouton "Exporter / Importer" dans Paramètres pour transférer les
   données d'un appareil à un autre en attendant une vraie base de
   données partagée (voir la discussion dans le chat).
   ===================================================================== */

const STORAGE_KEY = "ah_data";

// Paliers de reward par défaut (repris du catalogue "Explode Partners").
function defaultRewardTiers(){
  return [
    {id:"tier_10", ftd:10, amount:100},
    {id:"tier_100", ftd:100, amount:900},
    {id:"tier_500", ftd:500, amount:4000},
    {id:"tier_1000", ftd:1000, amount:5000},
    {id:"tier_2000", ftd:2000, amount:10000},
    {id:"tier_3000", ftd:3000, amount:10000},
    {id:"tier_4000", ftd:4000, amount:10000},
    {id:"tier_5000", ftd:5000, amount:10000},
  ];
}
function defaultMemberLinks(){
  return { community:[], game:[], liens:[] };
}
// Convertit l'ancien format (un seul lien) vers le nouveau (plusieurs liens nommés).
function migrateMemberLinks(db){
  if(!db.memberLinks){ db.memberLinks = defaultMemberLinks(); return; }
  const ml = db.memberLinks;
  if(ml.community===undefined || ml.game===undefined){
    const genId = ()=>"lnk_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    const community = ml.communityUrl ? [{id:genId(), label:"Communauté", url:ml.communityUrl}] : [];
    const game = ml.gameUrl ? [{id:genId(), label:ml.gameLabel||"Lancer le jeu", url:ml.gameUrl}] : [];
    db.memberLinks = { community, game, liens: ml.liens||[] };
  }
  if(db.memberLinks.liens===undefined) db.memberLinks.liens = [];
}

// URL du serveur partagé (celui qu'on a déployé sur Render). Toutes les
// données (affiliés, stats, réglages) y sont sauvegardées en vrai, pas
// seulement dans ce navigateur — donc visibles depuis n'importe quel
// appareil. Le navigateur garde une copie locale comme secours si le
// serveur est temporairement injoignable (ex : mise en veille Render).
const REMOTE_URL = (function(){
  try{
    const cached = JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
    return (cached.syncConfig && cached.syncConfig.apiUrl) || "https://affinix-postback-server.onrender.com";
  }catch(e){ return "https://affinix-postback-server.onrender.com"; }
})();

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.mainTrackingLink===undefined) parsed.mainTrackingLink="";
      if(!parsed.syncConfig) parsed.syncConfig={apiUrl:"",apiKey:""};
      if(parsed.referralBonusPerFtd===undefined) parsed.referralBonusPerFtd=5;
      if(parsed.defaultBaseLink===undefined) parsed.defaultBaseLink="";
      if(parsed.defaultBaseLinkLabel===undefined) parsed.defaultBaseLinkLabel="Signup";
      if(parsed.defaultCommissionPerFtd===undefined) parsed.defaultCommissionPerFtd = parsed.defaultCommissionPct!==undefined ? 0 : 30;
      (parsed.affiliates||[]).forEach(a=>{ if(a.commissionPerFtd===undefined) a.commissionPerFtd = a.commissionPct!==undefined ? 0 : 30; });
      if(parsed.allowSelfSignup===undefined) parsed.allowSelfSignup=true;
      if(!parsed.pendingSignups) parsed.pendingSignups=[];
      (parsed.affiliates||[]).forEach(a=>{ if(a.referredBy===undefined) a.referredBy=null; if(!a.messages) a.messages=[]; });
      migrateMemberLinks(parsed);
      if(!parsed.rewardTiers) parsed.rewardTiers=defaultRewardTiers();
      return parsed;
    }
  }catch(e){ console.error(e); }
  return { affiliates: [], passcode: "2909", mainTrackingLink: "", syncConfig: { apiUrl: "", apiKey: "" }, referralBonusPerFtd: 5, defaultBaseLink: "", defaultBaseLinkLabel: "Signup", defaultCommissionPerFtd: 30, allowSelfSignup: true, pendingSignups: [], memberLinks: defaultMemberLinks(), rewardTiers: defaultRewardTiers() };
}
function saveData(){
  DB.localEditedAt = Date.now();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){ console.error(e); }
  pushRemoteDB();
}
// Envoie la base complète au serveur partagé (sans jamais y inclure la
// clé API en clair, pour ne pas l'exposer publiquement via /api/db).
function pushRemoteDB(){
  if(!REMOTE_URL || !DB.syncConfig || !DB.syncConfig.apiKey) return;
  const payload = JSON.parse(JSON.stringify(DB));
  payload.syncConfig = { apiUrl: (DB.syncConfig.apiUrl||REMOTE_URL), apiKey: "" };
  fetch(REMOTE_URL+"/api/db", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":DB.syncConfig.apiKey},
    body: JSON.stringify(payload)
  }).catch(()=>{});
}
// Récupère la base partagée une fois au chargement, en conservant la
// clé API déjà présente sur cet appareil (elle n'est jamais renvoyée
// par le serveur).
async function fetchRemoteDB(){
  if(!REMOTE_URL) return;
  try{
    // Si on vient de modifier quelque chose localement il y a moins de 3 minutes
    // (ex : un lien ajouté en Paramètres), on ne laisse pas une copie distante
    // potentiellement plus ancienne écraser ce changement — on retente juste
    // l'envoi vers le serveur au passage, au cas où le premier envoi aurait échoué.
    if(DB.localEditedAt && (Date.now() - DB.localEditedAt < 180000)){
      pushRemoteDB();
      return;
    }
    const res = await fetch(REMOTE_URL+"/api/db");
    if(!res.ok) return;
    const { db } = await res.json();
    if(!db){
      // Le serveur n'a encore aucune donnée : on lui envoie notre copie
      // locale actuelle pour l'initialiser (si on a la clé admin).
      pushRemoteDB();
      return;
    }
    const localSync = DB.syncConfig || {apiUrl:"",apiKey:""};
    if(db.mainTrackingLink===undefined) db.mainTrackingLink="";
    if(!db.syncConfig) db.syncConfig={apiUrl:"",apiKey:""};
    if(db.referralBonusPerFtd===undefined) db.referralBonusPerFtd=5;
    if(db.defaultBaseLink===undefined) db.defaultBaseLink="";
    if(db.defaultBaseLinkLabel===undefined) db.defaultBaseLinkLabel="Signup";
    if(db.defaultCommissionPerFtd===undefined) db.defaultCommissionPerFtd = db.defaultCommissionPct!==undefined ? 0 : 30;
    (db.affiliates||[]).forEach(a=>{ if(a.commissionPerFtd===undefined) a.commissionPerFtd = a.commissionPct!==undefined ? 0 : 30; });
    if(db.allowSelfSignup===undefined) db.allowSelfSignup=true;
    if(!db.pendingSignups) db.pendingSignups=[];
    (db.affiliates||[]).forEach(a=>{ if(a.referredBy===undefined) a.referredBy=null; if(!a.messages) a.messages=[]; });
    migrateMemberLinks(db);
    if(!db.rewardTiers) db.rewardTiers=defaultRewardTiers();
    db.syncConfig = { apiUrl: db.syncConfig.apiUrl||localSync.apiUrl||REMOTE_URL, apiKey: localSync.apiKey||"" };
    DB = db;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    render();
  }catch(e){ /* serveur injoignable (ex: en veille) — on garde la copie locale */ }
}

/* ---------------- Notifications FTD ---------------- */
const NOTIF_MEMBER_KEY = "affinix_notif_member";
const NOTIF_ADMIN_KEY = "affinix_notif_admin";
const FTD_BASELINE_KEY = "affinix_ftd_baseline";

function notifSupported(){ return typeof Notification !== "undefined"; }
function notifPermission(){ return notifSupported() ? Notification.permission : "unsupported"; }
function notifEnabled(key){ return notifSupported() && Notification.permission==="granted" && localStorage.getItem(key)==="1"; }

async function toggleFtdNotifications(key){
  if(!notifSupported()){ alert("Les notifications ne sont pas prises en charge sur cet appareil/navigateur."); return; }
  if(notifEnabled(key)){
    localStorage.setItem(key,"0");
    render();
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm==="granted"){
    localStorage.setItem(key,"1");
    primeFtdBaseline();
    showFtdNotification("Notifications activées ✔", "Tu seras alerté dès qu'un nouveau FTD arrive.");
    if(key===NOTIF_MEMBER_KEY && SESSION && SESSION.role==="member"){
      subscribeToPush(SESSION.id).catch(()=>{});
    }
  } else {
    localStorage.setItem(key,"0");
  }
  render();
}
function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,"+").replace(/_/g,"/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c=>c.charCodeAt(0)));
}
async function subscribeToPush(affiliateId){
  if(!REMOTE_URL || !("serviceWorker" in navigator) || !("PushManager" in window)) return;
  const keyRes = await fetch(`${REMOTE_URL}/api/vapid-public-key`);
  const { publicKey } = await keyRes.json();
  if(!publicKey) return;
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub){
    sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(publicKey) });
  }
  await fetch(`${REMOTE_URL}/api/push-subscribe`, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ affiliateId, subscription: sub })
  });
}

function showFtdNotification(title, body){
  try{
    if("serviceWorker" in navigator){
      navigator.serviceWorker.ready.then(reg=>{
        if(reg && reg.showNotification) reg.showNotification(title, { body, icon:"icon-192.png", badge:"icon-192.png" });
        else if(notifSupported()) new Notification(title, { body, icon:"icon-192.png" });
      }).catch(()=>{ if(notifSupported()) new Notification(title, { body, icon:"icon-192.png" }); });
    } else if(notifSupported()){
      new Notification(title, { body, icon:"icon-192.png" });
    }
  }catch(e){ console.error(e); }
}

function getFtdBaseline(){
  try{ return JSON.parse(localStorage.getItem(FTD_BASELINE_KEY)||"{}"); }catch(e){ return {}; }
}
function setFtdBaseline(obj){ try{ localStorage.setItem(FTD_BASELINE_KEY, JSON.stringify(obj)); }catch(e){} }
// Enregistre l'état actuel des FTD sans déclencher de notification (appelé à l'activation).
function primeFtdBaseline(){
  const baseline = {};
  (DB.affiliates||[]).forEach(a=>{ baseline[a.id] = sumStats(a.dailyStats).ftd; });
  setFtdBaseline(baseline);
}

function checkFtdNotifications(){
  if(!DB || !DB.affiliates) return;
  const memberOn = notifEnabled(NOTIF_MEMBER_KEY) && SESSION && SESSION.role==="member";
  const adminOn = notifEnabled(NOTIF_ADMIN_KEY) && SESSION && SESSION.role==="admin";
  if(!memberOn && !adminOn) return;
  const baseline = getFtdBaseline();
  const firstRun = Object.keys(baseline).length===0;
  const newBaseline = {};
  DB.affiliates.forEach(a=>{
    const ftd = sumStats(a.dailyStats).ftd;
    newBaseline[a.id] = ftd;
    if(firstRun) return;
    const prev = baseline[a.id];
    if(prev===undefined || ftd<=prev) return;
    const diff = ftd - prev;
    if(adminOn){
      showFtdNotification("Nouveau FTD 🎉", `${a.name} vient de générer ${diff} FTD supplémentaire${diff>1?"s":""}.`);
    }
    if(memberOn && SESSION.id===a.id){
      showFtdNotification("Nouveau FTD 🎉", `Tu viens de générer ${diff} nouveau${diff>1?"x":""} FTD !`);
    }
  });
  setFtdBaseline(newBaseline);
}

setInterval(()=>{ fetchRemoteDB().then(checkFtdNotifications); }, 60000);

function notifButtonHtml(key){
  const on = notifEnabled(key);
  const blocked = notifSupported() && Notification.permission==="denied";
  if(blocked){
    return `<span title="Notifications bloquées dans les réglages du navigateur" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)">${icon('bell',14,'#8892b0')} Notifications bloquées</span>`;
  }
  return `<button class="btn-ghost" style="padding:8px 14px;font-size:13px;display:flex;align-items:center;gap:6px;${on?'color:#6ee7b7;border-color:rgba(52,211,153,.3)':''}" onclick="toggleFtdNotifications('${key}')">${icon('bell',14,on?'#6ee7b7':'#5c9cf8')} ${on?"Notifications activées":"Activer les notifications"}</button>`;
}


let DB = loadData();
let SESSION = null; // {role:'admin'} or {role:'member', id}
let VIEW = "overview";
let charts = {};
const urlRefCode = new URLSearchParams(location.search).get("ref") || "";

/* ---------------- utils ---------------- */
const uid = (p="aff") => p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const todayStr = () => new Date().toISOString().slice(0,10);
const eur = n => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(Number(n)||0);
const numf = n => new Intl.NumberFormat('fr-FR').format(Number(n)||0);
const pctf = n => (Number(n)||0).toFixed(1)+"%";
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function isoWeekStart(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const day = (d.getDay()+6)%7;
  d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}
const monthKey = d => d.slice(0,7);
function labelForKey(key, period){
  if(period==="day"||period==="week"){ const d=new Date(key+"T00:00:00"); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}); }
  const [y,m]=key.split('-'); return new Date(+y,+m-1,1).toLocaleDateString('fr-FR',{month:'short',year:'2-digit'});
}
function sumStats(list){
  return list.reduce((a,s)=>{a.clicks+=+s.clicks||0;a.signups+=+s.signups||0;a.ftd+=+s.ftd||0;a.deposits+=+s.deposits||0;a.revenue+=+s.revenue||0;return a;},{clicks:0,signups:0,ftd:0,deposits:0,revenue:0});
}
function groupStats(list, period){
  const map=new Map();
  for(const s of list){
    const key = period==="day"?s.date:period==="week"?isoWeekStart(s.date):monthKey(s.date);
    const cur = map.get(key)||{key,clicks:0,signups:0,ftd:0,deposits:0,revenue:0};
    cur.clicks+=+s.clicks||0;cur.signups+=+s.signups||0;cur.ftd+=+s.ftd||0;cur.deposits+=+s.deposits||0;cur.revenue+=+s.revenue||0;
    map.set(key,cur);
  }
  return Array.from(map.values()).sort((a,b)=>a.key.localeCompare(b.key)).map(r=>({...r,label:labelForKey(r.key,period)}));
}
function findAffiliate(id){ return DB.affiliates.find(a=>a.id===id); }

/* ---------------- parrainage : helpers ---------------- */
function filleulsOf(sponsorId){ return DB.affiliates.filter(a=>a.referredBy===sponsorId); }
function referralEarningsFor(filleul){ return sumStats(filleul.dailyStats).ftd * (DB.referralBonusPerFtd||0); }
function totalReferralEarnings(sponsorId){ return filleulsOf(sponsorId).reduce((acc,f)=>acc+referralEarningsFor(f),0); }
function referralHistoryFor(sponsorId){
  const rows=[];
  filleulsOf(sponsorId).forEach(f=>{
    f.dailyStats.forEach(s=>{
      if(+s.ftd>0) rows.push({date:s.date, filleulName:f.name, ftd:+s.ftd, amount:+s.ftd*(DB.referralBonusPerFtd||0)});
    });
  });
  return rows.sort((a,b)=>b.date.localeCompare(a.date));
}

/* ---------------- messagerie interne (membre <-> admin) ---------------- */
function unreadForAdmin(a){ return (a.messages||[]).filter(m=>m.from==="member" && !m.readByAdmin).length; }
function unreadForMember(a){ return (a.messages||[]).filter(m=>m.from==="admin" && !m.readByMember).length; }
function totalUnreadForAdmin(){ return DB.affiliates.reduce((n,a)=>n+unreadForAdmin(a),0); }
function sendMessage(affiliateId, from, text){
  const a = findAffiliate(affiliateId);
  if(!a || !text.trim()) return;
  if(!a.messages) a.messages=[];

function setLoginTab(t){ loginTab=t; signupSuccess=""; renderLogin(); }
async function submitSelfSignup(e){
  e.preventDefault();
  const name = document.getElementById("regName").value.trim();
  const code = document.getElementById("regCode").value.trim();
  const refInput = document.getElementById("regRef").value.trim();
  if(!name || !code) return renderLogin("Nom et code d'accès sont obligatoires."), false;
  const taken = DB.affiliates.some(a=>a.code.toLowerCase()===code.toLowerCase()) || (DB.pendingSignups||[]).some(p=>p.code.toLowerCase()===code.toLowerCase());
  if(taken) return renderLogin("Ce code d'accès est déjà pris, choisis-en un autre."), false;

  if(REMOTE_URL){
    try{
      const res = await fetch(REMOTE_URL+"/api/signup", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({name, code, ref: refInput})
      });
      const data = await res.json();
      if(!res.ok){ return renderLogin(data.error||"Inscription impossible pour le moment."), false; }
      DB.pendingSignups = DB.pendingSignups||[];
      DB.pendingSignups.unshift(data.request);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
      signupSuccess = "Ta demande a été envoyée ✔ L'administrateur doit la valider avant que tu puisses te connecter.";
      loginTab = "member";
      renderLogin();
      return false;
    }catch(err){
      return renderLogin("Le serveur est momentanément injoignable (il peut mettre jusqu'à 1 minute à se réveiller). Réessaie dans un instant."), false;
    }
  }

  DB.pendingSignups = DB.pendingSignups||[];
  DB.pendingSignups.unshift({id:uid(), name, code, ref:refInput, requestedAt:new Date().toISOString()});
  saveData();
  signupSuccess = "Ta demande a été envoyée ✔ L'administrateur doit la valider avant que tu puisses te connecter.";
  loginTab = "member";
  renderLogin();
  return false;
}
function approveSignup(reqId){
  const req = (DB.pendingSignups||[]).find(p=>p.id===reqId);
  if(!req) return;
  if(!DB.defaultBaseLink){ alert("Renseigne d'abord un \"Lien de base pour les inscrits\" dans Paramètres avant de valider."); return; }
  let referredBy = null;
  if(req.ref){ const sponsor = DB.affiliates.find(a=>a.code.toLowerCase()===req.ref.toLowerCase()); if(sponsor) referredBy = sponsor.id; }
  DB.affiliates.unshift({
    id: uid(), name: req.name, code: req.code,
    baseLinks: [{label: DB.defaultBaseLinkLabel||"Signup", url: DB.defaultBaseLink}],
    commissionPerFtd: DB.defaultCommissionPerFtd||0,
    referredBy, status:"active", createdAt: todayStr(), dailyStats: [], messages: []
  });
  DB.pendingSignups = DB.pendingSignups.filter(p=>p.id!==reqId);
  saveData(); render();
}
function rejectSignup(reqId){
  if(!confirm("Refuser cette demande d'inscription ?")) return;
  DB.pendingSignups = (DB.pendingSignups||[]).filter(p=>p.id!==reqId);
  saveData(); render();
}
function submitMemberLogin(e){
  e.preventDefault();
  const name = document.getElementById("loginName").value.trim();
  const code = document.getElementById("loginCode").value.trim();
  const match = DB.affiliates.find(a=>a.name.trim().toLowerCase()===name.toLowerCase() && a.code===code);
  if(!match) return renderLogin("Nom ou code incorrect."), false;
  if(match.status!=="active") return renderLogin("Ce compte est actuellement suspendu."), false;
  SESSION = {role:"member", id:match.id}; VIEW="overview"; render();
  return false;
}
function submitAdminLogin(e){
  e.preventDefault();
  const code = document.getElementById("adminCode").value.trim();
  if(code===DB.passcode){ SESSION={role:"admin"}; VIEW="overview"; render(); }
  else renderLogin("Code d'accès incorrect.");
  return false;
}
function logout(){ SESSION=null; render(); }

function submitBroadcast(e){
  e.preventDefault();
  const input = document.getElementById("broadcastInput");
  const text = input.value.trim();
  const msg = document.getElementById("broadcastMsg");
  if(!text){ msg.className="err"; msg.textContent="Écris un message avant d'envoyer."; return false; }
  if(!REMOTE_URL || !DB.syncConfig || !DB.syncConfig.apiKey){
    msg.className="err"; msg.textContent="Synchronisation non configurée (Paramètres > Synchronisation) — impossible d'envoyer une notification push.";
    return false;
  }
  msg.className=""; msg.textContent="Envoi en cours…";
  fetch(`${REMOTE_URL}/api/broadcast-push`, {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":DB.syncConfig.apiKey},
    body: JSON.stringify({ title:"AffiniX", body:text })
  }).then(r=>r.json()).then(d=>{
    if(d && d.ok){
      msg.className="ok"; msg.textContent=`Notification envoyée à ${d.sent} appareil(s) ✔`;
      input.value="";
    } else {
      msg.className="err"; msg.textContent=(d&&d.error)||"Échec de l'envoi.";
    }
  }).catch(()=>{ msg.className="err"; msg.textContent="Serveur injoignable, réessaie dans un instant."; });
  return false;
}

function attachReferralManual(){
  const msg = document.getElementById("manualRefMsg");
  const filleulInput = document.getElementById("manualFilleul").value.trim();
  const parrainInput = document.getElementById("manualParrain").value.trim();
  if(!filleulInput){ msg.className="err"; msg.textContent="Indique le nom ou le code du filleul."; return; }
  const filleul = DB.affiliates.find(a=>a.code.toLowerCase()===filleulInput.toLowerCase()||a.name.toLowerCase()===filleulInput.toLowerCase());
  if(!filleul){ msg.className="err"; msg.textContent="Aucun sous-affilié trouvé avec ce nom/code pour le filleul."; return; }
  if(!parrainInput){
    filleul.referredBy = null;
    saveData(); render();
    return;
  }
  const parrain = DB.affiliates.find(a=>a.code.toLowerCase()===parrainInput.toLowerCase()||a.name.toLowerCase()===parrainInput.toLowerCase());
  if(!parrain){ msg.className="err"; msg.textContent="Aucun sous-affilié trouvé avec ce nom/code pour le parrain."; return; }
  if(parrain.id===filleul.id){ msg.className="err"; msg.textContent="Un affilié ne peut pas se parrainer lui-même."; return; }
  filleul.referredBy = parrain.id;
  saveData(); render();
}
function unlinkReferral(filleulId){
  if(!confirm("Détacher ce parrainage ? (utile en cas d'auto-parrainage ou de fraude)")) return;
  const f=findAffiliate(filleulId); if(f){ f.referredBy=null; saveData(); render(); }
}

function allTrackingLinks(a){
  const rows = (a.baseLinks && a.baseLinks.length) ? a.baseLinks
    : (a.baseLink||a.trackingLink) ? [{label:"Principal", url:a.baseLink||a.trackingLink}]
    : [];
  return rows.filter(r=>r.url).map(r=>{
    const sep = r.url.includes("?") ? "&" : "?";
    return { label: r.label||"Lien", link: r.url + sep + "sub=" + encodeURIComponent(a.code||"") };
  });
}
function genRandomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sans caractères ambigus (0/O, 1/I)
  let out = "";
  for(let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}

async function syncAffiliate(id){
  const a = findAffiliate(id);
  if(!a) return;
  const cfg = DB.syncConfig;
  if(!cfg || !cfg.apiUrl){ alert("Configure d'abord l'URL du serveur dans Paramètres > Synchronisation."); return; }
  const btn = document.getElementById("syncBtn_"+id);
  if(btn){ btn.disabled = true; btn.textContent = "Synchronisation…"; }
  try{
    const res = await fetch(`${cfg.apiUrl}/api/stats/${encodeURIComponent(a.code)}`, {
      headers: cfg.apiKey ? { "x-api-key": cfg.apiKey } : {}
    });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    const autoRows = (data.dailyStats||[]).map(r=>({ id: uid("stat"), source:"auto", ...r }));
    // On retire les anciennes lignes auto pour les remplacer par les nouvelles (les manuelles sont conservées)
    a.dailyStats = a.dailyStats.filter(s=>s.source!=="auto").concat(autoRows);
    saveData(); render();
  }catch(err){
    alert("Échec de la synchronisation : "+err.message);
    if(btn){ btn.disabled=false; btn.textContent="Synchroniser"; }
  }
}
async function syncAllAffiliates(){
  for(const a of DB.affiliates){ await syncAffiliate(a.id); }
}
async function silentSyncOne(a){
  const cfg = DB.syncConfig;
  if(!cfg || !cfg.apiUrl || !cfg.apiKey) return false;
  try{
    const res = await fetch(`${cfg.apiUrl}/api/stats/${encodeURIComponent(a.code)}`, { headers:{ "x-api-key": cfg.apiKey } });
    if(!res.ok) return false;
    const data = await res.json();
    const autoRows = (data.dailyStats||[]).map(r=>({ id: uid("stat"), source:"auto", ...r }));
    a.dailyStats = a.dailyStats.filter(s=>s.source!=="auto").concat(autoRows);
    return true;
  }catch(err){ return false; }
}
async function silentSyncAll(){
  if(!(DB.syncConfig && DB.syncConfig.apiKey)) return;
  let changed = false;
  for(const a of DB.affiliates){ if(await silentSyncOne(a)) changed = true; }
  if(changed){ saveData(); render(); }
}

function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download="affiliatehub-data.json"; a.click();
  URL.revokeObjectURL(url);
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.affiliates || !parsed.passcode) throw new Error("format invalide");
      migrateMemberLinks(parsed);
      if(!parsed.rewardTiers) parsed.rewardTiers=defaultRewardTiers();
      (parsed.affiliates||[]).forEach(a=>{ if(!a.messages) a.messages=[]; });
      DB = parsed; rewardTierRows = null; communityLinkRows = null; gameLinkRows = null; messagesOpenId = null; saveData(); render();
      alert("Données importées avec succès.");
    }catch(err){ alert("Fichier invalide."); }
  };
  reader.readAsText(file);
}
function resetAllData(){
  if(!confirm("Confirmer la suppression définitive de toutes les données ?")) return;
  DB = {affiliates:[], passcode:DB.passcode, memberLinks:defaultMemberLinks(), rewardTiers:defaultRewardTiers(), pendingSignups:[]};
  rewardTierRows = null; communityLinkRows = null; gameLinkRows = null; messagesOpenId = null;
  saveData(); render();
}

function filterAssistantTips(query){
  const q = query.trim().toLowerCase();
  const tips = document.querySelectorAll(".assistant-tip");
  let anyVisible = false;
  tips.forEach(el=>{
    const match = !q || el.getAttribute("data-search").includes(q);
    el.style.display = match ? "" : "none";
    if(match) anyVisible = true;
  });
  document.querySelectorAll(".assistant-cat-group").forEach(group=>{
    const visibleInGroup = [...group.querySelectorAll(".assistant-tip")].some(el=>el.style.display!=="none");
    group.style.display = visibleInGroup ? "" : "none";
  });
  const noRes = document.getElementById("assistantNoResult");
  if(noRes) noRes.style.display = anyVisible ? "none" : "block";
}

(function(){
  let deferredPrompt = null;
  const DISMISS_KEY = 'affinix_install_dismissed';

  function alreadyDismissed(){
    // Fermé pour l'onglet/session en cours seulement : reviendra à la prochaine ouverture du site.
    if(sessionStorage.getItem('affinix_install_snoozed') === '1') return true;
    // Sauf si l'app a déjà été installée : là, on ne redemande plus jamais.
    return localStorage.getItem(DISMISS_KEY) === 'forever';
  }
  function snoozeDismiss(){
    sessionStorage.setItem('affinix_install_snoozed', '1');
  }
  function dismissForever(){
    localStorage.setItem(DISMISS_KEY, 'forever');
  }

  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }

  function showInstallBadge(){
    if(alreadyDismissed() || isStandalone()) return;
    if(document.getElementById('installBadge')) return;

    const el = document.createElement('div');
    el.id = 'installBadge';
    el.style.cssText = `
      position:fixed; right:18px; bottom:18px; left:18px; z-index:9999;
      display:flex; align-items:center; gap:10px; justify-content:flex-end;
      font-family:inherit; color:#e7ebf7; font-size:13px;
      animation:installBadgeIn .35s ease; pointer-events:none;
    `;
    el.innerHTML = `
      <style>
        @keyframes installBadgeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
        #installBadge button{cursor:pointer;}
        #installBadgeInner{
          pointer-events:auto;
          display:flex; align-items:center; gap:10px;
          background:linear-gradient(180deg, rgba(23,32,55,0.92), rgba(12,17,30,0.92));
          border:1px solid rgba(96,156,248,0.25);
          backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
          border-radius:16px; padding:10px 12px 10px 14px;
          box-shadow:0 10px 30px -8px rgba(0,0,0,.5);
          max-width:100%; box-sizing:border-box;
        }
        #installBadgeInstall{
          display:flex; align-items:center; gap:8px; background:linear-gradient(135deg,#3468e0,#ffb84a);
          color:#04101f; font-weight:700; border:none; border-radius:12px; padding:9px 14px;
          font-size:13px; font-family:inherit; box-shadow:0 8px 20px -8px rgba(52,104,224,.65);
          transition:.2s ease; white-space:nowrap; flex:1; justify-content:center;
        }
        #installBadgeInstall:hover{ transform:translateY(-1px); filter:brightness(1.06); }
        #installBadgeClose{
          background:transparent; border:none; color:#8892b0; width:26px; height:26px;
          border-radius:50%; display:flex; align-items:center; justify-content:center;
          flex-shrink:0; transition:.2s ease; padding:0;
        }
        #installBadgeClose:hover{ background:rgba(148,163,184,.15); color:#e7ebf7; }
        @media (min-width:640px){
          #installBadge{ justify-content:flex-end; left:auto; }
          #installBadgeInner{ max-width:300px; }
          #installBadgeInstall{ flex:none; }
        }
      </style>
      <div id="installBadgeInner">
        <button id="installBadgeInstall" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          Installer l'app
        </button>
        <button id="installBadgeClose" type="button" aria-label="Fermer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
    `;
    document.body.appendChild(el);

    document.getElementById('installBadgeClose').addEventListener('click', ()=>{
      snoozeDismiss();
      el.remove();
    });

    document.getElementById('installBadgeInstall').addEventListener('click', async ()=>{
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if(outcome === 'accepted'){ dismissForever(); }
      deferredPrompt = null;
      el.remove();
    });
  }

  function isIOS(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  function isSafariIOS(){
    // Sur iOS, tous les navigateurs utilisent WebKit ; Chrome/Firefox iOS ont "crios"/"fxios" dans le UA
    return isIOS() && !/crios|fxios|edgios|opios/i.test(navigator.userAgent);
  }

  function showIOSBadge(){
    if(alreadyDismissed() || isStandalone()) return;
    if(document.getElementById('installBadge')) return;

    const el = document.createElement('div');
    el.id = 'installBadge';
    el.style.cssText = `
      position:fixed; right:18px; bottom:18px; left:18px; z-index:9999;
      display:flex; align-items:flex-start; gap:10px;
      background:linear-gradient(180deg, rgba(23,32,55,0.92), rgba(12,17,30,0.92));
      border:1px solid rgba(96,156,248,0.25);
      backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
      border-radius:16px; padding:12px 12px 12px 14px;
      box-shadow:0 10px 30px -8px rgba(0,0,0,.5);
      font-family:inherit; color:#e7ebf7; font-size:13px; line-height:1.5;
      animation:installBadgeIn .35s ease;
      max-width:380px; margin:0 auto;
    `;
    el.innerHTML = `
      <style>
        @keyframes installBadgeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
        #installBadgeClose{
          background:transparent; border:none; color:#8892b0; width:22px; height:22px;
          border-radius:50%; display:flex; align-items:center; justify-content:center;
          flex-shrink:0; transition:.2s ease; padding:0; cursor:pointer; margin-left:auto;
        }
        #installBadgeClose:hover{ background:rgba(148,163,184,.15); color:#e7ebf7; }
        #installBadge .ios-icon{
          flex-shrink:0; width:32px; height:32px; border-radius:9px;
          background:linear-gradient(135deg,#3468e0,#ffb84a); display:flex;
          align-items:center; justify-content:center; color:#04101f;
        }
      </style>
      <div class="ios-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;margin-bottom:2px;">Installer l'app</div>
        <div style="color:#8892b0;">Appuyez sur <strong style="color:#e7ebf7;">Partager</strong> puis <strong style="color:#e7ebf7;">Sur l'écran d'accueil</strong>.</div>
      </div>
      <button id="installBadgeClose" type="button" aria-label="Fermer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    `;
    document.body.appendChild(el);

    document.getElementById('installBadgeClose').addEventListener('click', ()=>{
      snoozeDismiss();
      el.remove();
    });
  }

  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    showInstallBadge();
  });

  window.addEventListener('appinstalled', ()=>{
    dismissForever();
    const el = document.getElementById('installBadge');
    if(el) el.remove();
  });

  // iOS (Safari, Chrome iOS, Firefox iOS...) ne déclenche jamais beforeinstallprompt :
  // on affiche un message avec les instructions manuelles.
  if(isIOS()){
    window.addEventListener('load', ()=>{ setTimeout(showIOSBadge, 800); });
  }
})();
</script>
</body>
</html>
