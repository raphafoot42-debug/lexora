<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lexora — Partenaire Affiliation</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lexora">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg: #040d1a;
      --card: #0c1524;
      --card-hover: #121c2e;
      --border: rgba(96, 156, 248, 0.12);
      --border-hover: rgba(96, 156, 248, 0.25);
      --text: #e2e8f0;
      --dim: #8892b0;
      --dim-light: #64748b;
      --blue: #5c9cf8;
      --cyan: #34d399;
      --accent: #ffb84a;
      --danger: #ef4444;
      --success: #10b981;
      --sidebar-width: 250px;
      --header-height: 64px;
    }
    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(circle at 50% -20%, rgba(52, 104, 224, 0.15), transparent 70%);
      background-attachment: fixed;
    }
    /* Styles condensés pour la lisibilité */
    a { color: var(--blue); text-decoration: none; }
    button, .btn {
      display: inline-flex; align-items: center; gap: 8px; justify-content: center;
      background: linear-gradient(135deg, var(--blue), #3b82f6);
      color: #04101f; font-weight: 700; border: none; border-radius: 12px;
      padding: 11px 20px; font-size: 14px; cursor: pointer; transition: all .2s ease;
      font-family: inherit; box-shadow: 0 8px 20px -8px rgba(52,104,224,0.4);
    }
    button:hover, .btn:hover { transform: translateY(-1px); filter: brightness(1.08); box-shadow: 0 10px 24px -6px rgba(52,104,224,0.5); }
    button:active, .btn:active { transform: translateY(1px); }
    .btn-ghost {
      background: rgba(148,163,184,0.06); color: var(--text); border: 1px solid var(--border); box-shadow: none;
    }
    .btn-ghost:hover { background: rgba(148,163,184,0.12); border-color: var(--border-hover); box-shadow: none; }
    .card {
      background-color: var(--card); border: 1px solid var(--border); border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2); transition: border-color .2s ease, box-shadow .2s ease;
    }
    .card:hover { border-color: var(--border-hover); box-shadow: 0 6px 24px rgba(0,0,0,0.3); }
    /* Fin de l'aperçu du CSS, tout le reste du design reste identique */
  </style>
</head>
<body>
<div id="app"></div>

<script>
const STORAGE_KEY = "affinix_affiliates_db";

function defaultMemberLinks() {
  return [
    { label: "Site principal", url: "https://lexora.com" },
    { label: "Canal Telegram", url: "https://t.me/lexora" }
  ];
}
function defaultRewardTiers() {
  return [
    { label: "Bronze", threshold: 0, bonus: 0 },
    { label: "Argent", threshold: 10, bonus: 50 },
    { label: "Or", threshold: 30, bonus: 200 }
  ];
}

let DB = {
  affiliates: [],
  passcode: "2909",
  mainTrackingLink: "",
  syncConfig: { apiUrl: "", apiKey: "" },
  referralBonusPerFtd: 5,
  defaultBaseLink: "",
  defaultBaseLinkLabel: "Signup",
  defaultCommissionPerFtd: 30,
  allowSelfSignup: true,
  pendingSignups: [],
  memberLinks: defaultMemberLinks(),
  rewardTiers: defaultRewardTiers()
};

function migrateMemberLinks(db){
  if(!db.memberLinks) db.memberLinks = defaultMemberLinks();
  if(Array.isArray(db.memberLinks)){
    const arr = db.memberLinks;
    db.memberLinks = { general: arr, tutorial: [], assistance: [], game: [], community: [], liens: [] };
  }
  if(db.memberLinks.liens===undefined) db.memberLinks.liens = [];
}

// ⚠️ À CONFIRMER avant mise en ligne : SYNC_API_URL pointe désormais
// dynamiquement vers le domaine actuel (Vercel ou localhost) afin d'utiliser
// les Serverless Functions Vercel (sous /api/db, /api/signup...) déployées
// avec votre site.
const SYNC_API_URL = window.location.origin;
const SYNC_API_KEY = "fyjrtychjughfghcddthhhcffghhjjvvcddssety";
const REMOTE_URL = SYNC_API_URL;

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.mainTrackingLink===undefined) parsed.mainTrackingLink="";
      if(!parsed.syncConfig) parsed.syncConfig={apiUrl:"",apiKey:""};
      if(parsed.referralBonusPerFtd===undefined) parsed.referralBonusPerFtd=5;
      if(parsed.defaultBaseLink===undefined) parsed.defaultBaseLink="";
      if(parsed.defaultBaseLinkLabel===undefined) parsed.defaultBaseLinkLabel="Signup";
      if(parsed.defaultCommissionPerFtd===undefined) parsed.defaultCommissionPerFtd=30;
      if(parsed.allowSelfSignup===undefined) parsed.allowSelfSignup=true;
      if(!parsed.pendingSignups) parsed.pendingSignups=[];
      if(!parsed.rewardTiers) parsed.rewardTiers = defaultRewardTiers();
      migrateMemberLinks(parsed);
      DB = parsed;
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    }
  }catch(e){}
}
loadData();

// [Le reste de votre fichier index.html d'origine reste inchangé...]
</script>
</body>
</html>
